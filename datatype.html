<html>

<head>
    <title>Data Types</title>
</head>

<body>
    <h1>JavaScript data types</h1>
    <script>
        var a=8;
        var b=10;
        
        var d=null;
        var e;//undefined variable

        document.write("The value of a is: " + (a==b));
        document.write("<br>");
        document.write("The value of d is: " + d);
        document.write("<br>");
        document.write("The value of e is: " + e);
        document.write("<br>");
        document.write("The type of a is: " + a);
        document.write("<br>");
        document.write("The type of b is: " + b);

    </script>
</body>
</html>
