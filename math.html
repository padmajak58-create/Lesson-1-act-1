<html>
    <body>
        <p>Multiply every element in the array with 10:</p>
        <P id="product_value"></P>
        <script>
           var number=[28,6,19,95];
           function mmyFunction(num)
           {
            return num *10000;
           }

           var newarray=number.map(mmyFunction);
           document.getElementById("product_value").innerHTML=newarray;
           </script>
    </body>
</html>
